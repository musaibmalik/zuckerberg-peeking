<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A blank page where Mark Zuckerberg peeks in from the edge.">
  <title>Mark Zuckerberg Peeking</title>
  <link rel="preload" href="/assets/peeking-widget.js" as="script">
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; background: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { min-height: 100svh; overflow-x: clip; }
    main { min-height: 100svh; }
    ybouane-peeking canvas { image-rendering: auto; }
    .fallback { position: fixed; bottom: 24px; left: 24px; right: 24px; color: #666; font: 14px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main aria-label="Blank canvas with Mark Zuckerberg peeking in"></main>
  <!-- Same peeking widget, with the character redrawn as Mark Zuckerberg.
       Original widget by ybouane, https://peeking.ybouane.com/. -->
  <script>
    window.PeekingWidgetConfig = {
      autoPeek: !window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      introDelayMs: 1200,
      idleWaitMinMs: 4000,
      idleWaitMaxMs: 7000,
      heightPx: Math.min(620, Math.round(window.innerHeight * 0.86)),
      mobileHeightPx: Math.min(460, Math.round(window.innerHeight * 0.72)),
      topPx: 0,
      mobileTopPx: 0,
      analytics: false,
      poster: '',
      avatar: null,
      dialogContent: '<h2>Mark Zuckerberg</h2><p>Peeking in from the edge of a blank page.</p><p>Motion widget by <a href="https://peeking.ybouane.com" target="_blank" rel="noopener noreferrer">ybouane</a>.</p>'
    };
  </script>
  <script src="/assets/peeking-widget.js" async onerror="document.getElementById('fallback').hidden=false"></script>
  <p class="fallback" id="fallback" hidden>The animation could not load. Please refresh when you are online.</p>
</body>
</html>
